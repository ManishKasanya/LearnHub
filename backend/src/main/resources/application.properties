spring.application.name=learnhub-backend
server.port=8080

# =============================================================
# Persistent Embedded Database Configuration (Zero-Config)
# Stores data to disk in `./data/learnhub_db` with MySQL compatibility
# =============================================================
spring.datasource.url=jdbc:h2:file:./data/learnhub_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Disable automatic schema.sql initialization (JPA handles DDL)
spring.sql.init.mode=never

# =============================================================
# JPA / Hibernate Configuration
# =============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# =============================================================
# File Upload Configuration (Max 500MB for video/resources)
# =============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# =============================================================
# LearnHub Custom App Configuration
# =============================================================
# 256-bit Hex Key for HMAC-SHA256 JWT generation
learnhub.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 hours (in milliseconds)
learnhub.app.jwtExpirationMs=86400000
# Directory where uploaded files, videos, avatars & certificates will be stored
learnhub.app.uploadDir=./uploads
# Frontend URL for CORS configuration
learnhub.app.clientUrl=http://localhost:5173
